// Pins every Firebase library, including the ones the FlutterFire plugins pull
// in and the messaging dependency the app module declares for
// PushMessagingService, so they can never resolve to different versions.
// FlutterFire reads this property if it is set; keep it in step with the
// FirebaseSDKVersion in the firebase_core package when upgrading.
ext.FirebaseSDKVersion = '34.14.0'

allprojects {
    repositories {
        google()
        jcenter()
    }
}

rootProject.buildDir = '../build'

// Need to remove this when subprojects have namespace properly updated for gradle 8
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace = project.group.toString()  // Set namespace as fallback
                }
                project.tasks.whenTaskAdded { task ->
                    if (task.name.contains('processDebugManifest') || task.name.contains('processReleaseManifest')) {
                        task.doFirst {
                            File manifestFile = file("${projectDir}/src/main/AndroidManifest.xml")
                            if (manifestFile.exists()) {
                                String manifestContent = manifestFile.text
                                if (manifestContent.contains('package=')) {
                                    manifestContent = manifestContent.replaceAll(/package="[^"]*"/, "")
                                    manifestFile.write(manifestContent)
                                    println "Removed 'package' attribute from ${manifestFile}"
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}
// 
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
